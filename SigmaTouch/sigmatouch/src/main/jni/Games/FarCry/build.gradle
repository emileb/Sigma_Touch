plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.opentouchgaming.sigmatouch.farcry'
    compileSdkVersion versions.target_sdk

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        ndk {
            // arm64 only, like :Quake4: the engine's 64-bit configuration is the
            // one the Linux/macOS port runs and Far Cry's working set is too big
            // for a 32-bit address space anyway.
            abiFilters = ['arm64-v8a']
        }
        externalNativeBuild {
            cmake {
                // No -flto: 16 shared libraries of 2004-era C++ and full LTO
                // makes every link slow for no measurable win.
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DCMAKE_CXX_FLAGS=-O2 -fno-omit-frame-pointer -g",
                        "-DCMAKE_C_FLAGS=-O2 -fno-omit-frame-pointer -g",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -Wl,--build-id -Wl,-z,max-page-size=16384",
                        "$build_flags.CMAKE_ANDROID_STL", "-DANDROID_ARM_MODE=arm"
            }
        }
    }
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
}

// openal-soft must be built before us so its merged_native_libs .so exists when
// our CMake links against it (same pattern the other engine modules use).
preBuild.dependsOn ':openal:build'

dependencies {
    implementation(project(":openal"))
    implementation libs.androidx.appcompat
    implementation libs.material
    androidTestImplementation libs.androidx.espresso.core
}
