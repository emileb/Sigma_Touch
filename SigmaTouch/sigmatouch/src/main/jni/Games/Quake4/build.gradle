plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.opentouchgaming.sigmatouch.quake4'
    compileSdkVersion versions.target_sdk

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        ndk {
            // arm64 only. openQ4 targets x64/arm64 as its compatibility
            // baseline, and its module naming (game-sp_arm64, renderer-gles_arm64)
            // has no tag the engine agrees on for 32-bit ARM. Quake 4's working
            // set is also well past what a 32-bit address space holds.
            abiFilters = ['arm64-v8a']
        }
        externalNativeBuild {
            cmake {
                // android-24: bionic only exposes getifaddrs()/freeifaddrs()
                // from API 24, and posix_net.cpp's IPv6 interface enumeration
                // needs them. Every arm64 device is well past this anyway.
                arguments "-DANDROID_PLATFORM=android-24",
                        // No -flto: this is ~800 translation units and full LTO
                        // makes the link take longer than the rest of the app's
                        // build put together, for no measurable win here.
                        "-DCMAKE_CXX_FLAGS=-O2 -fno-omit-frame-pointer -g -std=c++20",
                        "-DCMAKE_C_FLAGS=-O2 -fno-omit-frame-pointer -g",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -Wl,--build-id -Wl,-z,max-page-size=16384",
                        "$build_flags.CMAKE_ANDROID_STL", "-DANDROID_ARM_MODE=arm",
                        // openQ4 packs baseoq4/pak0.pk4 and pak1.pk4 itself and
                        // bakes their MD5s into the engine, so the app has to
                        // ship the exact pair this build produced. Stage them
                        // into this module's own assets: AGP merges them into
                        // the APK under quake4/, and they disappear along with
                        // the .so files when the app drops the dependency.
                        "-DOPENQ4_PAK_ASSET_DIR=${projectDir}/src/main/assets/quake4"
            }
        }
    }
    buildTypes {
        release {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=MinSizeRel"
                }
            }
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        debug {
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
}

// openal-soft must be built before us so its merged_native_libs .so exists when
// our CMake links against it (same pattern the other engine modules use).
preBuild.dependsOn ':openal:build'

dependencies {
    implementation(project(":openal"))
    implementation libs.androidx.appcompat
    implementation libs.material
    androidTestImplementation libs.androidx.espresso.core
}
