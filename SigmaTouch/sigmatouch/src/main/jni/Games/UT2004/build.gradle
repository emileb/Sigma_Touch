plugins {
    alias(libs.plugins.android.library)
}

// The engine's Android boot inis, shipped as assets/ut2004/ for UT2004Launcher to seed user_files/ut2004/.
def ut2004Inis = tasks.register('ut2004Inis', Copy) {
    from file('src/main/jni/engine-ut2004/Engine/Config/android')
    include 'Default.ini', 'DefUser.ini'
    into layout.buildDirectory.dir('generated/ut2004/assets/ut2004')
}

android {
    namespace 'com.opentouchgaming.sigmatouch.ut2004'
    compileSdkVersion versions.target_sdk

    defaultConfig {
        minSdk versions.min_sdk
        targetSdk versions.target_sdk

        ndk {
            abiFilters = abi_filters
        }
        externalNativeBuild {
            cmake {
                // The engine sets its own compile flags; only the link flags are shared.
                arguments "-DANDROID_PLATFORM=android-$versions.native_android_platform_version",
                        "-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -Wl,--build-id -Wl,-z,max-page-size=16384",
                        "$build_flags.CMAKE_ANDROID_STL", "-DANDROID_ARM_MODE=arm",
                        "-DCMAKE_BUILD_TYPE=RelWithDebInfo"
                targets "SDLLaunch"
            }
        }
    }
    buildTypes {
        release {
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/ut2004/assets')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version versions.cmake_version
        }
    }
    buildToolsVersion versions.build_tools_version
    ndkVersion versions.ndk_version
}

preBuild.dependsOn ut2004Inis

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.material
}
